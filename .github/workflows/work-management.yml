name: Canonical Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'kis-readonly-queue/main/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact head
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PROJECT_ENVIRONMENT: C:\Projects\.kis-mcp\python-env
      UV_CACHE_DIR: C:\Projects\.kis-mcp\uv-cache
      UV_PYTHON_INSTALL_DIR: C:\Projects\.tools\uv\python
      UV_TOOL_DIR: C:\Projects\.tools\uv\tools
      UV_TOOL_BIN_DIR: C:\Projects\.tools\uv\bin
      KIS_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KIS_EXACT_SHA }}
          persist-credentials: false

      - name: Install uv bootstrap
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Stage uv under Projects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Projects\.tools\uv\bin | Out-Null
          $UvSource = (Get-Command uv -ErrorAction Stop).Source
          Copy-Item -LiteralPath $UvSource -Destination C:\Projects\.tools\uv\bin\uv.exe -Force
          $UvxSource = Join-Path (Split-Path -Parent $UvSource) 'uvx.exe'
          if (Test-Path -LiteralPath $UvxSource) {
            Copy-Item -LiteralPath $UvxSource -Destination C:\Projects\.tools\uv\bin\uvx.exe -Force
          }
          "C:\Projects\.tools\uv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\Projects\.tools\uv\bin;$env:PATH"
          $Resolved = (Get-Command uv -ErrorAction Stop).Source
          if ($Resolved -ne 'C:\Projects\.tools\uv\bin\uv.exe') {
            throw "UV_PATH_MISMATCH: expected C:\Projects\.tools\uv\bin\uv.exe, resolved $Resolved"
          }

      - name: Prepare canonical repository path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Projects\kis-mcp | Out-Null
          Get-ChildItem -Force | Where-Object Name -ne '.venv' | Copy-Item -Destination C:\Projects\kis-mcp -Recurse -Force
          $Actual = (git -C C:\Projects\kis-mcp rev-parse HEAD).Trim().ToLowerInvariant()
          if ($Actual -ne $env:KIS_EXACT_SHA.ToLowerInvariant()) {
            throw "EXACT_HEAD_MISMATCH: expected $env:KIS_EXACT_SHA, checked out $Actual"
          }

      - name: Synchronize locked environment once
        shell: pwsh
        working-directory: C:\Projects\kis-mcp
        run: uv sync --locked --all-groups

      - name: Run canonical repository verification
        shell: pwsh
        working-directory: C:\Projects\kis-mcp
        run: pwsh -NoProfile -File scripts/verify.ps1 -SkipDependencySync
