[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "kis-mcp"
version = "0.1.0"
description = "A supervised three-rule FastMCP gateway for Desktop Commander"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "fastmcp[tasks]==4.0.0b3",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
kis-mcp = "kis_mcp.server:main"

[tool.kis-mcp]
deployment-model = "source-checkout-only"
configuration-root = "."

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
