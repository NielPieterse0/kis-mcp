[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kis-mcp"
version = "0.1.0"
description = "A supervised three-rule FastMCP gateway for Desktop Commander"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastmcp==3.4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
kis-mcp = "kis_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
